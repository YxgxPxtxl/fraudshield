[project]
name = "fraudshield"
version = "0.1.0"
description = "Real-time card fraud detection"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
addopts = "-q"

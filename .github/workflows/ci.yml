name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest --cov=ml/src --cov-report=term-missing --cov-fail-under=70
